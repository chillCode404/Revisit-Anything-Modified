name: segvlad
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - libblas=*=*mkl
  - mkl
  - pip
  # Removed Linux C/C++ dependencies

  # CUDA & FAISS:
  # CUDA 10.2 in original code is outdated for modern GPUs.
  # Using CUDA 11.8 for compatibility with modern GPUs and PyTorch.
  - cudatoolkit=11.8
  - faiss-gpu

  - pip:
    #   # PyTorch
    #    Authors want us to download torch later.
    #   - torch==1.11.0+cu113 --extra-index-url https://download.pytorch.org/whl/cu113
